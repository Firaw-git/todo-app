<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app">
        <h1>My Tasks</h1>
        <form id="task-form">
            <input id="task-input" placeholder="Add a new task..." autocomplete="off" required>
            <button type="submit">Add Task</button>
            
        </form>
        <p id="task-count"></p>
        <ul id="task-list"></ul>
        <button id="delete-btnn" type="button">Clear tasks</button>
    </main>
</body>
</html>
